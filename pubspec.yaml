name: keseranpaseran
description: A new Flutter project.

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.2
  fl_chart: ^0.70.0

  # State Management / Routing
  flutter_riverpod: ^2.5.1
  go_router: ^17.0.0

  # Storage / Config
  shared_preferences: ^2.2.3
  flutter_dotenv: ^6.0.0

  # Backend (Supabase)
  supabase_flutter: ^2.5.6

  # Local Notifications（ローカル通知）
  flutter_local_notifications: ^19.5.0

  # WorkManager（毎日12時の通知スケジュール）
  workmanager: ^0.7.0

  # Firebase（※バージョンは今の実装と相性良いので触らないこと）
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter（コード品質チェック）
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/syokkan_fuwafuwa.png
    - assets/coffee01_blend.png
    - assets/drink_coffee_cup01_espresso.png
    - assets/drink_coffee_cup07_american.png
    - assets/badStatus.png
    - assets/goodStatus.png
    - assets/deadStatus.png
    - assets/can_coffee.png
    - assets/petbottle_water_full.png
